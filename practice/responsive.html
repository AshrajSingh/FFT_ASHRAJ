<html>
	<head>
		<title> Responsive web design</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			.main{
				display: flex;
				justify-content: space-around;
			}
			.html{
				background: blue;
				padding: 10px;
				width: 100px;
			}
			.css{
				background: green;
				padding: 10px;
				width: 100px;

			}
			.js{
				background: yellow;
				padding: 10px;
				width: 100px;

			}
			@media (max-width: 600px){
				.main{ flex-direction: column; justify-content:center; gap: 30px; align-items: center}
				.html{
					background: beige;
					padding: 10px;
					width: 100px;
				}
				.css{
					background: grey;
					padding: 10px;
					width: 100px;

				}
				.js{
					background: cyan;
					padding: 10px;
					width: 100px;

				}

			}	
		</style>
	</head>

	<body>
		<h1> Responsive web design </h1>
		<div class='main'>
			<div class="html">
				<h3> HTML </h3>
				<p> jdsuuinad </p>
			</div>
			<div class="css">
				<h3> CSS </h3>
				<p> jdsuuinad </p>
			</div>
			<div class="js">
				<h3> JavaScript </h3>
				<p> jdsuuinad </p>
			</div>
		</div>

	</body>
</html>
