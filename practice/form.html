<html>
	<head>
		<title> Student Registration Form</title>
		<style>
			body{display:flex; justify-content: center; text-align: center}
			div{ border: 1px solid black; width: 600px;}
			
			form{ display:flex; flex-direction: column; justify-content: center; text-align: left;}
			
			label{ margin: 10px 0; padding: 0 10px;}
			input{ padding: 8px; margin: 10px; }
				
			.gender{ border: none;  }
		
		</style>
	</head> 

	<body>
		<div>
			<h1> Student Registration Form </h1>
			<form>
				<label> Student Name </label>
				<input type='text' placeholder='Enter you name'/>

				<label> Password </label>

				<label> Date of birth </label>
				<input type='date' placeholder='Enter you name'/>
		
				<article class="gender">
					<label> Gender </label>
					<input type="radio" id='male' value='male' name='gender' /> <label for='male' > Male </label>
					<input type="radio" id='female' value='female' name='gnder' /> <label for='female'> Female </label>
					<input type="radio" id='other' value='other' name='gender' /> <label for='other' > Other </label>
				</article>

				<label> Courses</label>
				<select>
					<option> MCA </option>
					<option> BCA </option>
					<option> B.tech </option>
				<select>

				<label> Skills </label>
				<input type='checkbox' /><label> React.js </label>
				<input type='checkbox' /><label> express.js </label>
				<input type='checkbox' /><label> node.js </label>
				<input type='checkbox' /><label> mongoDB </label>

	
				<label> address </label>
				<textarea> </textarea>

				<button type='submit'> Submit </button> 
			</form>
		</div>
	</body>
</html>
